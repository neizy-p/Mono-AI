name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev
          pip install buildozer cython==0.29.36
          curl -L -o icons.ttf https://github.com/google/material-design-icons/raw/master/font/MaterialIcons-Regular.ttf
          buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: mono-ai-apk
          path: bin/*.apk
